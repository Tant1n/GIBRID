# (Это неофициальный продукт Minecraft, не одобрен Mojang или Microsoft и не связан с ними.

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
thiserror = "2.0"
byteorder = "1.4"
glam = "0.24"
bytemuck = "1"
bytemuck_derive = "1"
wgpu = "0.19"
winit = "0.30"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.9"
flate2 = "1"
serde_json = "1"

gibrid-core = { path = "crates/gibrid-core" }
gibrid-world = { path = "crates/gibrid-world" }
gibrid-storage = { path = "crates/gibrid-storage" }
gibrid-assets = { path = "crates/gibrid-assets" }
gibrid-mesh = { path = "crates/gibrid-mesh" }
gibrid-gameplay = { path = "crates/gibrid-gameplay" }
gibrid-network = { path = "crates/gibrid-network" }
gibrid-java-bridge = { path = "crates/gibrid-java-bridge" }
gibrid-renderer-wgpu = { path = "crates/gibrid-renderer-wgpu" }
gibrid-app = { path = "crates/gibrid-app" }
gibrid-testkit = { path = "crates/gibrid-testkit" }
gibrid-worldgen = { path = "crates/gibrid-worldgen" }

[workspace]
resolver = "2"
members = [
    "crates/gibrid-core",
    "crates/gibrid-world",
    "crates/gibrid-storage",
    "crates/gibrid-assets",
    "crates/gibrid-mesh",
    "crates/gibrid-gameplay",
    "crates/gibrid-mesh",
    "crates/gibrid-network",
    "crates/gibrid-java-bridge",
    "crates/gibrid-worldgen",
    "crates/gibrid-renderer-wgpu",
    "crates/gibrid-app",
    "crates/gibrid-testkit",
]